<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Group Chat</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#111827;
  height:100vh;
  overflow:hidden;
}

/* Join Screen */
#joinScreen{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.joinBox{
  width:100%;
  max-width:380px;
  background:#1f2937;
  padding:30px 22px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 10px 40px #0008;
}

.logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:50%;
  background:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  color:white;
}

.joinBox h1{
  color:white;
  margin:18px 0 8px;
}

.joinBox p{
  color:#9ca3af;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  border:0;
  outline:0;
  border-radius:12px;
  margin-bottom:12px;
  background:#374151;
  color:white;
  font-size:16px;
}

button{
  border:0;
  cursor:pointer;
}

/* Chat */
#chatScreen{
  display:none;
  height:100vh;
  flex-direction:column;
}

.header{
  height:65px;
  background:#1f2937;
  display:flex;
  align-items:center;
  padding:0 15px;
  color:white;
  box-shadow:0 2px 10px #0005;
}

.groupIcon{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  margin-right:12px;
}

.groupInfo h2{
  font-size:17px;
}

.groupInfo span{
  font-size:12px;
  color:#4ade80;
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
  background:#111827;
}

.message{
  max-width:78%;
  margin-bottom:12px;
  padding:10px 13px;
  border-radius:15px;
  background:#374151;
  color:white;
  word-wrap:break-word;
}

.message.mine{
  margin-left:auto;
  background:#2563eb;
}

.sender{
  font-size:12px;
  color:#93c5fd;
  margin-bottom:4px;
}

.time{
  font-size:10px;
  color:#cbd5e1;
  text-align:right;
  margin-top:4px;
}

.chatImage{
  max-width:230px;
  border-radius:12px;
  margin-top:5px;
  display:block;
}

/* Input area */
.inputArea{
  background:#1f2937;
  padding:10px;
  display:flex;
  align-items:center;
  gap:8px;
}

.photoBtn{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#374151;
  color:white;
  font-size:22px;
}

#messageInput{
  margin:0;
  flex:1;
  background:#374151;
}

.sendBtn{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#2563eb;
  color:white;
  font-size:20px;
}
</style>
</head>

<body>

<!-- JOIN -->
<div id="joinScreen">
  <div class="joinBox">
    <div class="logo">💬</div>

    <h1>Private Group</h1>
    <p>আপনার নাম দিয়ে গ্রুপে প্রবেশ করুন</p>

    <input id="nameInput"
           type="text"
           placeholder="আপনার নাম লিখুন">

    <button onclick="joinChat()"
      style="width:100%;padding:14px;border-radius:12px;background:#2563eb;color:white;font-size:16px;">
      গ্রুপে প্রবেশ করুন
    </button>
  </div>
</div>


<!-- CHAT -->
<div id="chatScreen">

  <div class="header">

    <div class="groupIcon">👥</div>

    <div class="groupInfo">
      <h2>আমাদের গ্রুপ</h2>
      <span>● Online</span>
    </div>

  </div>


  <div id="messages">

    <div class="message">
      <div class="sender">System</div>
      গ্রুপে স্বাগতম! 👋
      <div class="time">এখন</div>
    </div>

  </div>


  <div class="inputArea">

    <input type="file"
           id="imageInput"
           accept="image/*"
           hidden
           onchange="sendImage()">

    <button class="photoBtn"
            onclick="document.getElementById('imageInput').click()">
      📷
    </button>

    <input id="messageInput"
           type="text"
           placeholder="মেসেজ লিখুন..."
           onkeydown="if(event.key==='Enter') sendMessage()">

    <button class="sendBtn"
            onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>


<script>

let username = "";

/* Join */
function joinChat(){

  const name =
    document.getElementById("nameInput").value.trim();

  if(!name){
    alert("আগে আপনার নাম লিখুন!");
    return;
  }

  username = name;

  document.getElementById("joinScreen").style.display="none";

  document.getElementById("chatScreen").style.display="flex";
}


/* Send Message */
function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text = input.value.trim();

  if(!text) return;

  createMessage(text);

  input.value="";
}


/* Create Message */
function createMessage(text){

  const box =
    document.getElementById("messages");

  const message =
    document.createElement("div");

  message.className="message mine";

  message.innerHTML=`
    <div class="sender">${escapeHTML(username)}</div>
    ${escapeHTML(text)}
    <div class="time">${getTime()}</div>
  `;

  box.appendChild(message);

  box.scrollTop=box.scrollHeight;
}


/* Send Image */
function sendImage(){

  const file =
    document.getElementById("imageInput").files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    const box =
      document.getElementById("messages");

    const message =
      document.createElement("div");

    message.className="message mine";

    message.innerHTML=`
      <div class="sender">${escapeHTML(username)}</div>

      <img class="chatImage"
           src="${e.target.result}">

      <div class="time">${getTime()}</div>
    `;

    box.appendChild(message);

    box.scrollTop=box.scrollHeight;
  };

  reader.readAsDataURL(file);
}


/* Time */
function getTime(){

  return new Date().toLocaleTimeString(
    "bn-BD",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


/* Security */
function escapeHTML(text){

  const div=document.createElement("div");

  div.textContent=text;

  return div.innerHTML;
}

</script>

</body>
  </html>
